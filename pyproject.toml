[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sdk"
version = "0.1.0"
description = "SDK para construção de agentes compatíveis com a Agent Platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Seu Nome", email = "seu@email.com" }]
keywords = ["agents", "sdk", "tools", "llm"]

dependencies = ["pydantic>=2.7,<3.0"]

# ── Grupos de desenvolvimento (PEP 735) ────────────────────────

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "ipython>=8.0"]

# ── Scripts ────────────────────────────────────────────────────

[project.scripts]
agent-sdk = "agent_sdk.cli:app"

# ── Hatch (build) ──────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sdk"]
include = ["templates/"]

[tool.hatch.build.targets.sdist]
include = ["src/", "templates/", "README.md", "pyproject.toml"]

# ── Ruff ───────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ─────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "-q"]

# ── Coverage ───────────────────────────────────────────────────

[tool.coverage.run]
source = ["src/agent_sdk"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
